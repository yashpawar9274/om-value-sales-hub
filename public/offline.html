<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>You're offline — OM Value Homes CRM</title>
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <style>
      :root { color-scheme: light; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 1.5rem;
        font: 15px/1.55 system-ui, -apple-system, "Segoe UI", sans-serif;
        color: #0f172a;
        background: linear-gradient(160deg, #0a2d8f 0%, #123fbf 55%, #1b52e0 100%);
      }
      .card {
        width: 100%;
        max-width: 24rem;
        background: #fff;
        border-radius: 1.25rem;
        padding: 2rem 1.5rem;
        text-align: center;
        box-shadow: 0 24px 60px rgba(2, 16, 60, 0.28);
      }
      img { width: 68px; height: 68px; border-radius: 1rem; }
      h1 { font-size: 1.15rem; margin: 1rem 0 0.4rem; }
      p { margin: 0 0 1.4rem; color: #64748b; font-size: 0.9rem; }
      button {
        width: 100%;
        padding: 0.85rem 1rem;
        border: 0;
        border-radius: 0.75rem;
        background: #0a2d8f;
        color: #fff;
        font: inherit;
        font-weight: 600;
        cursor: pointer;
      }
      .hint { margin: 0.9rem 0 0; font-size: 0.75rem; color: #94a3b8; }
    </style>
  </head>
  <body>
    <div class="card">
      <img src="/icons/icon-192.png" alt="OM Value Homes CRM" width="68" height="68" />
      <h1>No internet connection</h1>
      <p>OM Value Homes CRM can't reach the server right now. Check your mobile data or Wi-Fi and try again.</p>
      <button onclick="location.reload()">Retry</button>
      <p class="hint">Your data is safe — nothing was lost.</p>
    </div>
    <script>
      window.addEventListener("online", function () {
        location.reload();
      });
    </script>
  </body>
</html>
